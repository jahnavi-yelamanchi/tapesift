[project]
name = "tapesift"
version = "0.1.0.dev0"
description = "Self-hosted engine that turns hours of video and audio into searchable, timestamped data at the lowest cost per hour."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jahnavi Yelamanchi", email = "jahnaviyelamanchi03@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["video", "audio", "search", "transcription", "vlm", "self-hosted"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "av>=19.0.1",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=2.2.0",
    "lancedb>=0.40.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "tokenizers>=0.23.3",
    "typer>=0.27.3",
]

[project.scripts]
tapesift = "tapesift.cli:main"

[project.optional-dependencies]
vision = [
    "pillow>=13.0.0",
    "torch>=2.14.1",
    "transformers==5.20.2",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "jsonschema>=4.26.0",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

# Dev and CI only: Linux resolves CPU torch from PyTorch's index (no CUDA wheels).
# Not in the published wheel's metadata; end users choose with uv's --torch-backend.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["docs"]  # plan docs hold illustrative snippets, not code

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "PTH",           # pathlib everywhere (unicode paths are a messy-data case)
    "T20",           # no print; use the logger
    "S",             # bandit: subprocess, timeouts, asserts
    "RUF",
]
ignore = ["S603", "S607"]  # argument-list subprocess calls to tools on PATH (ffprobe, nvidia-smi, git)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T20"]

[tool.pyright]
include = ["src", "tests", "scripts"]
# Cloud runners import modal, a tool run via uvx, not a project dependency (ADR 0008).
exclude = ["scripts/cloud"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "gpu: needs an NVIDIA GPU; runs on Modal, never on the laptop or in default CI",
    "slow: takes more than a few seconds",
    "model: loads real pinned model weights; runs only in the CI models job (owner Q4, 2026-10-19), never on the laptop (ADR 0008). The Silero VAD bundled in faster-whisper is package data and needs no marker (owner Q5).",
]
filterwarnings = ["error"]
