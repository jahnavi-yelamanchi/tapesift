[project]
name = "tapesift"
version = "0.1.0.dev0"
description = "Self-hosted engine that turns hours of video and audio into searchable, timestamped data at the lowest cost per hour."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jahnavi Yelamanchi", email = "jahnaviyelamanchi03@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["video", "audio", "search", "transcription", "vlm", "self-hosted"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
tapesift = "tapesift.cli:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["docs"]  # plan docs hold illustrative snippets, not code

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "PTH",           # pathlib everywhere (unicode paths are a messy-data case)
    "T20",           # no print; use the logger
    "S",             # bandit: subprocess, timeouts, asserts
    "RUF",
]
ignore = ["S603", "S607"]  # argument-list subprocess calls to tools on PATH (ffprobe, nvidia-smi, git)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T20"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "gpu: needs an NVIDIA GPU; runs on Modal, never on the laptop or in default CI",
    "slow: takes more than a few seconds",
]
filterwarnings = ["error"]
